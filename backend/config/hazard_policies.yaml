# 这些标签不能仅凭普通单张图片直接确认，Harness会保守降级或要求外部证据。
external_evidence_required:
  H006: 楼板设计荷载和材料重量/数量
  H009: 防倾覆/防坠装置检测报告或功能试验
  H010: 脚手架设计荷载和材料重量/数量
  H030: 接地布置、导通和接地电阻实测数据
  H056: 项目消防配置标准、面积和灭火器数量台账

measurement_or_calibration_required:
  H007: 堆放高度标尺或固定机位标定
  H008: 基坑边界与距离标定
  H020: 连墙件布置方案和尺度标定
  H021: 主节点距离标定
  H025: 栏杆高度标定
  H027: 防护棚长度标定
  H040: 自由端长度标定
  H042: 顶托伸出长度标定
  H062: 视频跟踪、时间和机位空间标定

# 这些隐患不能只凭“场景像某处”来推断，关键实体必须由模型列入
# visible_objects。该约束优先降低配电箱、脚手架和塔吊的跨类别幻觉。
visual_anchor_required:
  H018: [脚手架, 立杆]
  H037: [配电箱]
  H051: [塔吊, 塔机, 塔吊基础]

