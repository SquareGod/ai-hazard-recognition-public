  - id: combustible_waste
    prompt: combustible construction waste wood chips
    name: 可燃垃圾
    routes: [消防安全]
  - id: vehicle
    prompt: construction site vehicle
    name: 场内车辆
    routes: [交通安全]
  - id: traffic_mirror
    prompt: convex traffic safety mirror
    name: 道路反光镜
    routes: [交通安全]
  - id: drain
    prompt: drainage ditch catch pit
    name: 排水沟集水井
    routes: [防台防汛]
  - id: slope_surface
    prompt: construction slope excavation slope
    name: 边坡
    routes: [防台防汛]
  - id: slope_crack
    prompt: crack on soil slope
    name: 边坡裂缝
    routes: [防台防汛]

