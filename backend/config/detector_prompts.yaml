    routes: [起重机械]
  - id: lifting_bucket
    prompt: crane lifting bucket
    name: 吊斗
    routes: [起重机械]
  - id: machine_guard
    prompt: machine safety guard cover
    name: 机械防护罩
    routes: [施工机具]
  - id: fire_extinguisher
    prompt: fire extinguisher
    name: 灭火器
    routes: [消防安全]
  - id: hydrant_box
    prompt: fire hydrant cabinet
    name: 消火栓箱
    routes: [消防安全]
  - id: welding_arc
    prompt: welding operation sparks
    name: 焊接动火点
    routes: [人员防护, 消防安全]
  - id: fire_pan
    prompt: welding fire catch pan
    name: 接火斗
    routes: [消防安全]
  - id: warning_barrier
    prompt: construction warning barrier tape
    name: 警戒围挡
    routes: [模板工程, 有限空间]
  - id: warning_sign
    prompt: construction safety warning sign
    name: 警示标识
